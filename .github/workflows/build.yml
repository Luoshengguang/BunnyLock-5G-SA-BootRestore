name: Build BunnyLock APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source ZIP
        run: |
          mkdir -p source
          unzip -q *.zip -d source

      - name: Locate project
        run: |
          PROJECT=$(find source -name settings.gradle.kts -printf '%h\n' | head -1)
          if [ -z "$PROJECT" ]; then
            echo "Cannot find settings.gradle.kts"
            exit 1
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT"

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platforms;android-37" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Build APK
        run: |
          cd "$PROJECT"
          chmod +x
