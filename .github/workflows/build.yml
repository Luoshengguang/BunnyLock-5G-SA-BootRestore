name: Build BunnyLock APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Extract source ZIP
        run: |
          mkdir -p source
          unzip -q *.zip -d source

      - name: Locate project
        run: |
          PROJECT=$(find source -name settings.gradle.kts -printf '%h\n' | head -1)
          if [ -z "$PROJECT" ]; then
            echo "Cannot find settings.gradle.kts"
            exit 1
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Install required SDK
        run: |
          sdkmanager --install "platforms;android-37" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Build APK
        run: |
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BunnyLock-5G-SA-BootRestore-debug
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
